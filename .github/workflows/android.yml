# Builds an installable Android .apk on a GitHub Linux runner.
# Download it from the run's Artifacts, copy it to the phone and open it.
# Release is signed with the debug key (see android/app/build.gradle.kts),
# which is fine for sideloading but not for the Play Store.
name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: hero_bms-apk
          path: build/app/outputs/flutter-apk/app-release.apk
